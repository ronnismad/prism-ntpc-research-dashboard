<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1520" viewBox="0 0 1800 1520"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#708AB2"/></marker></defs><text x="900" y="70" fill="#1C2A47" font-family="Arial" font-size="46" text-anchor="middle">PRISM Energy Intelligence</text><text x="900" y="122" fill="#52627D" font-family="Arial" font-size="30" text-anchor="middle">NTPC research workflow</text><text x="80" y="200" fill="#315B97" font-family="Arial" font-size="29" text-anchor="start">OPERATING EVIDENCE</text><text x="960" y="200" fill="#437766" font-family="Arial" font-size="29" text-anchor="start">CONSOLIDATED FINANCIAL EVIDENCE</text><rect x="80" y="240" width="760" height="140" rx="17" fill="#EFF4FF" stroke="#A5B5D1" stroke-width="2"/><text x="108" y="283" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Capture public CEA reports</text><text x="108" y="323" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">Same eight station IDs, original PDFs and hashes</text><path d="M460 380 L460 426" fill="none" stroke="#708AB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="430" width="760" height="140" rx="17" fill="#EFF4FF" stroke="#A5B5D1" stroke-width="2"/><text x="108" y="473" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Apply each historical cutoff</text><text x="108" y="513" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">Date and availability proxy must pass the cutoff</text><path d="M460 570 L460 616" fill="none" stroke="#708AB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="620" width="760" height="140" rx="17" fill="#EFF4FF" stroke="#A5B5D1" stroke-width="2"/><text x="108" y="663" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Estimate quarter output</text><text x="108" y="703" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">Fiscal YTD to QTD, run rate and two baselines</text><path d="M460 760 L460 806" fill="none" stroke="#708AB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="810" width="760" height="140" rx="17" fill="#EFF4FF" stroke="#A5B5D1" stroke-width="2"/><text x="108" y="853" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Evaluate later outcomes</text><text x="108" y="893" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">Eight quarters and three cutoffs</text><text x="108" y="928" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">Later actuals enter scoring only</text><rect x="960" y="240" width="760" height="140" rx="17" fill="#EDF7F3" stroke="#A5B5D1" stroke-width="2"/><text x="988" y="283" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Read NTPC filings</text><text x="988" y="323" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">FY25/FY26 annual and Q1 FY27 results</text><path d="M1340 380 L1340 426" fill="none" stroke="#708AB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="430" width="760" height="140" rx="17" fill="#EDF7F3" stroke="#A5B5D1" stroke-width="2"/><text x="988" y="473" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Inspect financial quality</text><text x="988" y="513" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">Earnings, cash capex, financing interest and debt</text><path d="M1340 570 L1340 616" fill="none" stroke="#708AB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="960" y="620" width="760" height="140" rx="17" fill="#EDF7F3" stroke="#A5B5D1" stroke-width="2"/><text x="988" y="663" fill="#263653" font-family="Arial" font-size="30" text-anchor="start">Attach a dated NSE close</text><text x="988" y="703" fill="#52627D" font-family="Arial" font-size="25" text-anchor="start">28 Oct 2026 close, reported EPS and book value</text><path d="M1340 760 L1340 806" fill="none" 